[workspace]
resolver = "2"
members = [
  "crates/devchat-core",
  "crates/devchat-crypto",
  "crates/devchat-store",
  "crates/devchat-net",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
dirs = "5.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
hmac = "0.12"
if-addrs = "0.13"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
zeroize = { version = "1.8", features = ["derive"] }
