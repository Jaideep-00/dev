[package]
name = "devchat-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DevChat native Windows desktop application (Tauri 2 + Rust)"

[lib]
name = "devchat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
devchat-core = { path = "../crates/devchat-core" }
devchat-crypto = { path = "../crates/devchat-crypto" }
devchat-net = { path = "../crates/devchat-net" }
devchat-store = { path = "../crates/devchat-store" }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
